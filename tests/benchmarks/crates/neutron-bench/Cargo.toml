[package]
name = "neutron-bench"
version = "0.1.0"
edition = "2021"

[dependencies]
neutron-bot = { path = "../neutron-bot" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
chrono = "0.4"
eyre = "0.6"
tokio = { version = "1", features = ["full"] }
sysinfo = "0.30"
reqwest = { version = "0.12", features = ["json"] }
libc = "0.2"

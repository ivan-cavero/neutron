[package]
name = "golden-data"
version = "0.1.0"
edition = "2021"
description = "Extract chunk checksums from vanilla Minecraft servers for parity verification"

[dependencies]
neutron-world = { path = "../../crates/neutron-world" }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }

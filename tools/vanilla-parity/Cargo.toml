[package]
name = "vanilla-parity"
version = "0.1.0"
edition = "2021"
description = "Compare Neutron-generated chunks against vanilla for parity verification"

[dependencies]
neutron-worldgen = { path = "../../crates/neutron-worldgen" }
neutron-world = { path = "../../crates/neutron-world" }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }

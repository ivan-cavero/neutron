[package]
name = "neutron-bot"
version = "0.1.0"
edition = "2021"

[dependencies]
azalea = { git = "https://github.com/azalea-rs/azalea.git", branch = "main" }
azalea-protocol = { git = "https://github.com/azalea-rs/azalea.git", branch = "main" }
azalea-core = { git = "https://github.com/azalea-rs/azalea.git", branch = "main" }
bevy_ecs = "0.19"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
eyre = "0.6"
uuid = { version = "1", features = ["v4"] }

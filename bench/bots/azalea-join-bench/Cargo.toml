[package]
name = "azalea-join-bench"
version = "0.1.0"
edition = "2021"
description = "Join latency benchmark for Minecraft 26.2 using azalea"

[dependencies]
azalea = { git = "https://github.com/azalea-rs/azalea.git", branch = "main" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
eyre = "0.6.12"
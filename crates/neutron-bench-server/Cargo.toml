[package]
name = "neutron-bench-server"
version = "0.1.0"
edition = "2021"
description = "Benchmarks for Neutron server core components"

[dependencies]
neutron-protocol = { path = "../neutron-protocol" }
neutron-world = { path = "../neutron-world" }
neutron-worldgen = { path = "../neutron-worldgen" }
bytes = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "server_benchmarks"
harness = false

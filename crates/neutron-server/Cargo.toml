[package]
name = "neutron-server"
version = "0.1.0"
edition = "2021"
description = "Minimal functional Minecraft 26.2 server binary"

[dependencies]
neutron-protocol = { path = "../neutron-protocol" }
neutron-world = { path = "../neutron-world" }
neutron-worldgen = { path = "../neutron-worldgen" }
tokio = { version = "1", features = ["full"] }
bytes = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
ussr-nbt = "0.2"

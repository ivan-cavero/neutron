[package]
name = "neutron-parity"
version = "0.1.0"
edition = "2021"
description = "Deterministic Neutron-vs-vanilla comparison: strict MCA decoding, cell-exact diff, attributed reports"

[dependencies]
neutron-world = { path = "../neutron-world" }
neutron-worldgen = { path = "../neutron-worldgen" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "parity"
path = "src/main.rs"

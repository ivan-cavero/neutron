[package]
name = "neutron-world"
version = "0.1.0"
edition = "2021"
description = "Minecraft world storage: Anvil .mca regions, level.dat, and vanilla directory structure"

[dependencies]
bytes = "1"
thiserror = "2"
tracing = "0.1"
flate2 = "1"
ussr-nbt = "0.2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

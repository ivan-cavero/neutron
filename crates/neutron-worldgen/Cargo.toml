[package]
name = "neutron-worldgen"
version = "0.1.0"
edition = "2021"
description = "Minecraft 26.2 world generation: deterministic chunk generation matching vanilla"

[dependencies]
xxhash-rust = { version = "0.8", features = ["xxh3"] }
md-5 = "0.10"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
neutron-world = { path = "../neutron-world" }


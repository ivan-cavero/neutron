[package]
name = "neutron-worldgen"
version = "0.1.0"
edition = "2021"
description = "Minecraft 26.2 world generation: deterministic chunk generation matching vanilla"
autoexamples = false

[dependencies]
xxhash-rust = { version = "0.8", features = ["xxh3"] }
md-5 = "0.10"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
neutron-world = { path = "../neutron-world" }

# Default examples (parity probes). Historical run probes stay on disk
# under examples/ but are not built unless named here.
[[example]]
name = "block_parity"

[[example]]
name = "surface_diag"

[[example]]
name = "dump_ms"

[[example]]
name = "sculk_cave"

[[example]]
name = "sculk_pos"

[[example]]
name = "sculk_replay"

[[example]]
name = "sculk_vanworld"

[[example]]
name = "idx_probe"

[[example]]
name = "sculk_veintrace"

[[example]]
name = "biomecheck_tmp"

[[example]]
name = "parity_diag"

[[example]]
name = "chunk_check"

[[example]]
name = "gap_diag"

[[example]]
name = "tree_gap"

[[example]]
name = "feature_index_probe"

[[example]]
name = "dump_van_tree"

[[example]]
